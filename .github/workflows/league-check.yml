# Judges every pull request against the league rules. Free on public repositories.
#
# Safety model (see SECURITY.md):
#   - `pull_request`, never `pull_request_target`: the job gets a read-only token and no secrets.
#   - It runs the maintainer's code from the base branch. From the pull request it takes only
# check and fails it. Maintenance pull requests (Dependabot) never touch league/. league data files (JSON), after checking their paths and sizes, and never executes them.
#   - Pull request text (titles, branch names) is never put into a shell command.
# The check helps, but it doesn't replace review: GitHub runs a pull request's own copy of
# this file, so a hostile pull request could edit it to pass. Merge nothing that touches
# files outside league/.
name: League check

on:
  pull_request:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.# Only league pull requests. A pull request that touches league/ and anything else still runs this
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.# check and fails it. Maintenance pull requests (Dependabot) never touch league/.
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.paths: ['league/**']

permissions:
  contents: read

concurrency:
  group: league-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.runs-on: ubuntu-24.04
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.timeout-minutes: 10
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.steps:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.  - name: Check out the base branch (the maintainer's code, not the pull request's)
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    uses: actions/checkout@v7
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    with:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      ref: ${{ github.event.pull_request.base.sha }}
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      fetch-depth: 0
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      persist-credentials: false

 check and fails it. Maintenance pull requests (Dependabot) never touch league/.  - uses: actions/setup-node@v7
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    with:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      node-version: 22

 check and fails it. Maintenance pull requests (Dependabot) never touch league/.  - name: Install the engine (locked versions, install scripts off)
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

 check and fails it. Maintenance pull requests (Dependabot) never touch league/.  - name: Copy in the pull request's league files, and nothing else
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    env:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      PR_NUMBER: ${{ github.event.pull_request.number }}
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      BASE_SHA: ${{ github.event.pull_request.base.sha }}
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    run: |
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      set -euo pipefail
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      git fetch --no-tags --depth=50 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      git diff --name-status --no-renames "${BASE_SHA}...pr/head" > "$RUNNER_TEMP/changes.txt"
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      cat "$RUNNER_TEMP/changes.txt"
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      allowed='^league/[a-z0-9][a-z0-9-]{2,30}/(session\.json|seats/(harmony|rhythm|arrangement)\.json|moves/[0-9]{3}\.json)$'
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      while IFS=$'\t' read -r status file; do
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        # Anything else is reported by the checker below; it's never written to disk.
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        [[ "$status" == "A" && "$file" =~ $allowed ]] || continue
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        if [[ -e "$file" ]]; then
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.          echo "::error::$file already exists on the base branch. Update your branch and use the next free number."
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.          exit 1
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        fi
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        size=$(git cat-file -s "pr/head:$file")
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        if (( size > 8192 )); then
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.          echo "::error::$file is $size bytes; the limit is 8192."
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.          exit 1
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        fi
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        mkdir -p "$(dirname "$file")"
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.        git cat-file blob "pr/head:$file" > "$file"
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      done < "$RUNNER_TEMP/changes.txt"

 check and fails it. Maintenance pull requests (Dependabot) never touch league/.  - name: Judge the pull request
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    env:
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.      AUTHOR: ${{ github.event.pull_request.user.login }}
 check and fails it. Maintenance pull requests (Dependabot) never touch league/.    run: node bin/league.mjs check --root . --author "$AUTHOR" --changes "$RUNNER_TEMP/changes.txt"
